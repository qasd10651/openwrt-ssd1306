name: Build OLED CLI Binary

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build for ramips/mt76x8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl xz-utils zstd

      # 1. 設定快取：快取 openwrt-sdk 資料夾
      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: openwrt-sdk
          # 以 SDK 的版本號與架構做為快取 Key
          key: openwrt-sdk-24.10.8-ramips-mt76x8

      # 2. 下載 SDK：僅在快取未命中 (cache-hit != 'true') 時執行
      - name: Download OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/24.10.8/targets/ramips/mt76x8/openwrt-sdk-24.10.8-ramips-mt76x8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          echo "Downloading SDK..."
          curl -L $SDK_URL -o sdk.tar.zst
          tar -I zstd -xf sdk.tar.zst
          mv openwrt-sdk-* openwrt-sdk
          rm sdk.tar.zst

      - name: Cross-Compile OLED CLI
        run: |
          export STAGING_DIR=$(pwd)/openwrt-sdk/staging_dir
          export TOOLCHAIN_DIR=$(ls -d $STAGING_DIR/toolchain-*)
          export PATH=$TOOLCHAIN_DIR/bin:$PATH
          
          GCC_BIN=$(find $TOOLCHAIN_DIR/bin -name "*-gcc" | head -n 1)
          echo "使用編譯器: $GCC_BIN"
          
          $GCC_BIN -O2 -o oled_cli main.c I2C.c SSD1306_OLED.c

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: oled_cli_mt76x8
          path: oled_cli
